# Alembic config for the maze_api backend (roadmap step 7a).
#
# The database URL is deliberately NOT set here -- migrations/env.py reads it
# from maze_api.config.settings, so `alembic upgrade head` and the running app
# can never disagree about which database they mean. Override with the
# DATABASE_URL environment variable.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
