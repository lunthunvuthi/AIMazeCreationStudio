[project]
name = "maze-studio"
version = "0.1.0"
description = "Maze/quiz generation and validation, starting with the PickAxe Maze type"
requires-python = ">=3.9"
# pyjwt[crypto]/sqlalchemy/alembic arrived with roadmap step 7a (Auth0 login and
# the users table) -- see Web App/docs/auth_spec.md.
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pyjwt[crypto]",
    "sqlalchemy",
    "alembic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# Web App/spikes/pdf-renderer/ — throwaway renderer-tech comparison, not the
# main app's dependencies. See that folder's README.
pdf-renderer-spike = ["reportlab"]
# scripts/verify_worksheet_pdf.py only. Not needed to run or test the app —
# it reads an exported worksheet back and checks it against the page contract
# in PRODUCTION_PROCESS.md §4.
phase-b = ["pymupdf"]

[project.scripts]
pickaxe-maze = "pickaxe_maze.cli:main"

[tool.setuptools]
package-dir = { "" = "Maze-All-Contents/pickaxe-maze-creation", "maze_api" = "Web App/backend/maze_api" }
packages = ["pickaxe_maze", "maze_api"]

[tool.pytest.ini_options]
testpaths = ["Maze-All-Contents/pickaxe-maze-creation/tests", "Web App/backend/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
