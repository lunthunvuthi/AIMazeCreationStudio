[project]
name = "maze-studio"
version = "0.1.0"
description = "Maze/quiz generation and validation, starting with the PickAxe Maze type"
requires-python = ">=3.9"
dependencies = ["fastapi", "uvicorn", "pydantic"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
# Web App/spikes/pdf-renderer/ — throwaway renderer-tech comparison, not the
# main app's dependencies. See that folder's README.
pdf-renderer-spike = ["reportlab"]

[project.scripts]
pickaxe-maze = "pickaxe_maze.cli:main"

[tool.setuptools]
package-dir = { "" = "Maze-All-Contents/pickaxe-maze-creation", "maze_api" = "Web App/backend/maze_api" }
packages = ["pickaxe_maze", "maze_api"]

[tool.pytest.ini_options]
testpaths = ["Maze-All-Contents/pickaxe-maze-creation/tests", "Web App/backend/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
